<!doctype html>
<!--
  IMPORTANCIA: documento anfitrión donde Vite monta la aplicación React.
  PATRÓN: Application Shell; entrega la estructura HTML mínima y delega la UI.
  SOLUCIÓN ESPECÍFICA: metadatos, favicon, título y elemento `root` del inventario.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Panel de inventario y administración de productos del supermercado"
    />
    <meta name="theme-color" content="#201d25" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inventario" />
    <title>Inventario | Supermercado</title>
  </head>
  <body>
    <!-- React controla el contenido de este nodo desde src/main.tsx. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
