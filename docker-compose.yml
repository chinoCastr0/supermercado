# IMPORTANCIA: levanta la base PostgreSQL local usada por el backend.
# PATRÓN: Infrastructure as Code; describe infraestructura reproducible.
# SOLUCIÓN ESPECÍFICA: versión, credenciales, puerto y volumen de desarrollo.
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: supermercado
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: desarrollo
    ports:
      - "5433:5432"
    volumes:
      # El volumen conserva los datos aunque el contenedor sea recreado.
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
